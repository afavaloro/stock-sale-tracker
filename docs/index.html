<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sale Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sale Tracker">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --up: #006300; --down: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --chip-ok: #e6f2e6; --chip-no: #f0efec; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --up: #0ca30c; --down: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --chip-ok: #15301a; --chip-no: #262624; --accent: #3987e5;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; }
header { position: sticky; top: 0; z-index: 5; background: var(--page);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 0; border-bottom: 1px solid var(--border); }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 12px; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; border: 0; background: none; color: var(--ink-2); font: inherit; font-weight: 600;
  padding: 10px 10px 12px; border-bottom: 2.5px solid transparent; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding: 14px 16px calc(env(safe-area-inset-bottom) + 28px); max-width: 760px; margin: 0 auto; }
section[hidden] { display: none; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 22px 0 8px; font-weight: 600; }
h2:first-child { margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tk { font-weight: 700; font-size: 17px; }
.nm { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.px { font-weight: 600; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--chip-no); color: var(--ink-2); }
.chip.ok { background: var(--chip-ok); color: var(--up); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--accent); color: #fff; vertical-align: 2px; margin-left: 6px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.vs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.vs td, .vs th { padding: 7px 4px; border-bottom: 1px solid var(--grid); text-align: right; }
.vs th { font-size: 12px; color: var(--muted); font-weight: 600; }
.vs td:first-child, .vs th:first-child { text-align: left; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.seg { display: inline-flex; background: var(--chip-no); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
.seg button { border: 0; background: none; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
  white-space: nowrap; display: none; z-index: 2; }
.tip b { display: block; margin-bottom: 2px; }
.trade { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.trade:last-child { border-bottom: 0; }
.empty { text-align: center; color: var(--ink-2); padding: 26px 10px; }
.note { font-size: 13px; color: var(--ink-2); background: var(--chip-no); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 8px; }
ol.rules li { margin-bottom: 8px; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>S&amp;P 500 Sale Tracker</h1>
  <div class="sub" id="asof">Loading…</div>
  <nav role="tablist">
    <button role="tab" data-tab="sale" aria-selected="true">On sale</button>
    <button role="tab" data-tab="pf" aria-selected="false">Portfolios</button>
    <button role="tab" data-tab="trades" aria-selected="false">Trades</button>
    <button role="tab" data-tab="bt" aria-selected="false">Backtest</button>
    <button role="tab" data-tab="rules" aria-selected="false">Rules</button>
  </nav>
</header>
<main>
  <section id="sale"></section>
  <section id="pf" hidden></section>
  <section id="trades" hidden></section>
  <section id="bt" hidden></section>
  <section id="rules" hidden></section>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (v, d = 0) => v == null ? "—" : "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"}) : "—";
const BENCH = [["SPY", "S&P 500", "--s2"], ["QQQ", "Nasdaq-100", "--s3"], ["DIA", "Dow", "--s4"]];
const CHECKS = [["drop", "20%+ off high"], ["below_sma", "Below 200-day avg"], ["cheap", "P/E below sector"], ["quality", "Profitable + cash flow"]];
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let DATA = {};

// ---------- Tabs ----------
function show(tab) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== tab);
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
  window.scrollTo(0, 0);
  redrawCharts();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.tab));

// ---------- Line chart (SVG, crosshair tooltip, direct end labels) ----------
const charts = [];
function lineChart(host, dates, series, opts = {}) {
  const c = {host, dates, series, opts}; charts.push(c); drawChart(c); return c;
}
function redrawCharts() { charts.forEach(c => { if (c.host.offsetParent) drawChart(c); }); }
function drawChart({host, dates, series, opts}) {
  const W = Math.max(280, host.clientWidth || 320), H = opts.height || 220;
  const m = {t: 10, r: 62, b: 24, l: 40};
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length || dates.length < 2) { host.innerHTML = `<div class="empty small">The chart appears after a few days of data.</div>`; return; }
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const step = niceStep((hi - lo) / 4), ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(+v.toFixed(6));
  const x = i => m.l + (W - m.l - m.r) * i / (dates.length - 1);
  const y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "chart")}">`;
  ticks.forEach(v => {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? cssVar("--axis") : cssVar("--grid")}" stroke-width="1"/>`;
    svg += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${cssVar("--muted")}">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}%</text>`;
  });
  const n = dates.length, xl = [0, Math.floor((n - 1) / 2), n - 1];
  xl.forEach((i, k) => svg += `<text x="${x(i)}" y="${H - 6}" font-size="11" fill="${cssVar("--muted")}" text-anchor="${k === 0 ? "start" : k === 2 ? "end" : "middle"}">${shortDate(dates[i], dates)}</text>`);
  // lines: draw benchmarks first so the strategy sits on top
  [...series].reverse().forEach(s => {
    const d = s.values.map((v, i) => v == null ? "" : `${i && s.values[i - 1] != null ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    svg += `<path d="${d}" fill="none" stroke="${cssVar(s.color)}" stroke-width="${s.main ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  // direct end labels, nudged apart so they don't collide
  const ends = series.map(s => ({s, v: s.values[n - 1], yy: y(s.values[n - 1] ?? 0)})).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < ends.length; i++) if (ends[i].yy - ends[i - 1].yy < 13) ends[i].yy = ends[i - 1].yy + 13;
  ends.forEach(e => {
    svg += `<circle cx="${x(n - 1)}" cy="${y(e.v ?? 0)}" r="3.5" fill="${cssVar(e.s.color)}" stroke="${cssVar("--surface")}" stroke-width="2"/>`;
    svg += `<text x="${x(n - 1) + 8}" y="${e.yy + 4}" font-size="11" font-weight="600" fill="${cssVar("--ink-2")}">${esc(e.s.short)}</text>`;
  });
  svg += `<line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="${cssVar("--axis")}" stroke-width="1" visibility="hidden"/>`;
  series.forEach((s, k) => svg += `<circle class="dot${k}" r="4" fill="${cssVar(s.color)}" stroke="${cssVar("--surface")}" stroke-width="2" visibility="hidden"/>`);
  svg += `</svg>`;
  host.innerHTML = `<div class="legend">${series.map(s => `<span><i class="sw" style="background:var(${s.color})"></i>${esc(s.name)}</span>`).join("")}</div><div class="chart">${svg}<div class="tip"></div></div>`;
  const box = $(".chart", host), el = $("svg", box), tip = $(".tip", box);
  const move = ev => {
    const r = el.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (W - m.l - m.r) * (n - 1))));
    $(".xh", el).setAttribute("x1", x(i)); $(".xh", el).setAttribute("x2", x(i)); $(".xh", el).setAttribute("visibility", "visible");
    series.forEach((s, k) => { const d = $(".dot" + k, el); if (s.values[i] == null) return d.setAttribute("visibility", "hidden");
      d.setAttribute("cx", x(i)); d.setAttribute("cy", y(s.values[i])); d.setAttribute("visibility", "visible"); });
    tip.innerHTML = `<b>${fmtDate(dates[i])}</b>` + series.map(s => `<div><i class="sw" style="background:var(${s.color})"></i>${esc(s.short)} <span class="num">${pct(s.values[i])}</span>${opts.dollars && s.dollars ? ` <span class="muted">${money(s.dollars[i])}</span>` : ""}</div>`).join("");
    tip.style.display = "block";
    const left = x(i) * r.width / W;
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, left < r.width / 2 ? left + 12 : left - tip.offsetWidth - 12)) + "px";
  };
  const hide = () => { tip.style.display = "none"; $(".xh", el).setAttribute("visibility", "hidden"); series.forEach((s, k) => $(".dot" + k, el).setAttribute("visibility", "hidden")); };
  box.addEventListener("pointermove", move); box.addEventListener("pointerdown", move);
  box.addEventListener("pointerleave", hide); box.addEventListener("pointercancel", hide);
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function shortDate(s, all) {
  const days = (new Date(all[all.length - 1]) - new Date(all[0])) / 864e5;
  return new Date(s + "T12:00:00").toLocaleDateString("en-US", days > 300 ? {month: "short", year: "numeric"} : {month: "short", day: "numeric"});
}
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(redrawCharts, 150); });

// ---------- On sale ----------
function stockCard(r, opts = {}) {
  const chips = CHECKS.map(([k, label]) => `<span class="chip ${r.checks[k] ? "ok" : ""}">${r.checks[k] ? "✓" : "✗"} ${label}</span>`).join("");
  return `<div class="card">
    <div class="row"><div style="min-width:0"><span class="tk">${esc(r.ticker)}</span>${r.new_today ? '<span class="badge">NEW</span>' : ""}<div class="nm">${esc(r.name)} · ${esc(r.sector)}</div></div>
      <div style="text-align:right"><div class="px">${money(r.price, 2)}</div><div class="small down num">${pct(-r.drop_pct)} from high</div></div></div>
    <div class="small muted num" style="margin-top:6px">52-wk high ${money(r.high52, 2)} · 200-day avg ${money(r.sma200, 2)} · P/E ${r.pe ?? "—"} vs sector ${r.sector_pe ?? "—"}</div>
    ${opts.chips ? `<div class="chips">${chips}</div>` : ""}</div>`;
}
function renderSale(L) {
  const b = L.benchmarks || {};
  let h = `<div class="stats" style="grid-template-columns:repeat(3,1fr)">${BENCH.map(([t, n]) => `<div class="stat"><div class="l">${n}</div><div class="v" style="font-size:16px">${money(b[t]?.price, 2)}</div><div style="font-size:11.5px" class=" ${cls(-(b[t]?.drop_pct || 0))} num">${b[t]?.drop_pct ? pct(-b[t].drop_pct) + " off high" : "At its high"}</div></div>`).join("")}</div>`;
  h += `<h2>On sale today · ${L.on_sale.length}</h2>`;
  h += L.on_sale.length ? L.on_sale.map(r => stockCard(r)).join("")
    : `<div class="card empty">No S&amp;P 500 stock passes all four checks today.<br><span class="small muted">That's normal. The rules are strict on purpose.</span></div>`;
  h += `<h2>Almost on sale · 3 of 4 checks</h2>`;
  h += L.near_misses.length ? L.near_misses.map(r => stockCard(r, {chips: true})).join("") : `<div class="card empty small">None today.</div>`;
  const c = L.counts || {};
  h += `<p class="small muted">Of ${L.universe_size} stocks scanned: ${c.drop ?? 0} are 20%+ off their high, ${c.below_sma ?? 0} are below their 200-day average, ${c.cheap ?? 0} have a P/E well below their sector, and ${c.quality ?? 0} are profitable with positive cash flow.</p>`;
  $("#sale").innerHTML = h;
}

// ---------- Portfolios ----------
function compareTable(s, startLabel) {
  const rows = [["Sale strategy", s.value, s.return_pct, "--s1"], ...BENCH.map(([t, n, c]) => [`${n} (${t})`, s.bench[t].value, s.bench[t].return_pct, c])];
  return `<table class="vs"><tr><th>${startLabel}</th><th>Value</th><th>Return</th></tr>${rows.map(([n, v, p, c]) => `<tr><td><i class="sw" style="background:var(${c})"></i>${esc(n)}</td><td>${money(v)}</td><td class="${cls(p)}">${pct(p, 2)}</td></tr>`).join("")}</table>`;
}
function seriesFrom(hist, kind) {
  const dates = hist.map(h => h.date);
  if (kind === "fixed") {
    const inv = hist.map(h => h.fixed_invested);
    const r = vals => vals.map((v, i) => inv[i] ? (v / inv[i] - 1) * 100 : null);
    return {dates, series: [
      {name: "Sale strategy", short: "Sales", color: "--s1", main: true, values: r(hist.map(h => h.fixed_value)), dollars: hist.map(h => h.fixed_value)},
      ...BENCH.map(([t, n, c]) => ({name: `Same $ in ${t}`, short: t, color: c, values: r(hist.map(h => h.fixed_bench[t])), dollars: hist.map(h => h.fixed_bench[t])}))]};
  }
  const start = DATA.latest?.rules?.start_balance || 100000;
  const r = vals => vals.map(v => (v / start - 1) * 100);
  return {dates, series: [
    {name: "Sale strategy", short: "Sales", color: "--s1", main: true, values: r(hist.map(h => h.rules_value)), dollars: hist.map(h => h.rules_value)},
    ...BENCH.map(([t, n, c]) => ({name: `${t} buy & hold`, short: t, color: c, values: r(hist.map(h => h.rules_bench[t])), dollars: hist.map(h => h.rules_bench[t])}))]};
}
function renderPortfolio(el, P, title) {
  const S = P.summary, R = DATA.latest?.rules || {};
  if (!S || !S.fixed) { el.innerHTML = `<div class="card empty">No data yet.</div>`; return; }
  const fx = S.fixed, ru = S.rules;
  let h = title ? `<div class="note">${title}</div>` : "";
  h += `<h2>A · ${money(R.fixed_amount || 1000)} every time a stock goes on sale</h2>`;
  if (fx.signals) {
    h += `<div class="stats"><div class="stat"><div class="l">Invested · ${fx.signals} buys</div><div class="v">${money(fx.invested)}</div></div><div class="stat"><div class="l">Worth now</div><div class="v ${cls(fx.return_pct)}">${money(fx.value)}</div><div class="small ${cls(fx.return_pct)} num">${pct(fx.return_pct, 2)}</div></div></div>`;
    h += `<div class="card" style="margin-top:10px">${compareTable(fx, "Same dollars, same days")}<div class="fixedchart" style="margin-top:14px"></div></div>`;
  } else h += `<div class="card empty small">No buys yet. Strategy A starts investing the first time a stock passes all four checks.</div>`;
  h += `<h2>B · ${money(ru.start)} start, buy on sale, sell at +${R.take_profit_pct ?? 25}% or after ${Math.round((R.max_hold_days ?? 730) / 365)} yrs</h2>`;
  h += `<div class="stats"><div class="stat"><div class="l">Value now</div><div class="v ${cls(ru.return_pct)}">${money(ru.value)}</div><div class="small ${cls(ru.return_pct)} num">${pct(ru.return_pct, 2)}</div></div><div class="stat"><div class="l">Cash · ${ru.positions.length} holdings</div><div class="v">${money(ru.cash)}</div><div class="small muted">${ru.closed_count} sold${ru.win_rate != null ? ` · ${ru.win_rate}% at a profit` : ""}</div></div></div>`;
  h += `<div class="card" style="margin-top:10px">${compareTable(ru, `${money(ru.start)} on ${fmtDate(S.start_date)}`)}<div class="ruleschart" style="margin-top:14px"></div></div>`;
  if (ru.positions.length) {
    h += `<h2>Strategy B holdings</h2><div class="card">${ru.positions.slice(0, 60).map(p => `<div class="trade"><div><b>${esc(p.ticker)}</b> <span class="small muted">bought ${fmtDate(p.date)} at ${money(p.buy, 2)}</span></div><div class="num ${cls(p.pct)}">${pct(p.pct)}</div><div class="small muted">now ${money(p.now, 2)}</div><div class="small muted num">${money(p.value)}</div></div>`).join("")}</div>`;
  }
  el.innerHTML = h;
  const hist = P.history || [];
  if (fx.signals) { const firstBuy = hist.findIndex(x => x.fixed_invested > 0); const f = seriesFrom(hist.slice(Math.max(0, firstBuy)), "fixed"); lineChart($(".fixedchart", el), f.dates, f.series, {label: "Strategy A return vs indexes", dollars: true}); }
  const r = seriesFrom(hist, "rules"); lineChart($(".ruleschart", el), r.dates, r.series, {label: "Strategy B return vs indexes", dollars: true});
}

// ---------- Trades ----------
let tradeFilter = "rules";
function renderTrades() {
  const T = DATA.portfolio?.trades || [];
  const list = T.filter(t => t.strategy === tradeFilter);
  let h = `<div class="seg"><button aria-pressed="${tradeFilter === "rules"}" data-f="rules">Strategy B</button><button aria-pressed="${tradeFilter === "fixed"}" data-f="fixed">Strategy A</button></div>`;
  h += list.length ? `<div class="card">${list.map(t => `<div class="trade">
      <div><b class="${t.action === "buy" ? "" : cls(t.pnl)}">${t.action === "buy" ? "Bought" : "Sold"}</b> <b>${esc(t.ticker)}</b> <span class="small muted">${esc(t.name)}</span></div>
      <div class="num">${money(t.amount)}</div>
      <div class="small muted">${fmtDate(t.date)} at ${money(t.price, 2)}${t.reason ? ` · ${esc(t.reason)}, held ${t.held_days} days` : ""}</div>
      <div class="small num ${cls(t.pnl)}">${t.pnl != null ? pct(t.pnl_pct) : ""}</div></div>`).join("")}</div>`
    : `<div class="card empty">No trades yet.</div>`;
  $("#trades").innerHTML = h;
  document.querySelectorAll("#trades .seg button").forEach(b => b.onclick = () => { tradeFilter = b.dataset.f; renderTrades(); });
}

// ---------- Backtest ----------
function renderBacktest() {
  const B = DATA.backtest, el = $("#bt");
  if (!B) { el.innerHTML = `<div class="card empty">The backtest hasn't been run yet.<br><span class="small muted">On GitHub, open Actions → "Backtest" → Run workflow. It takes about 10 minutes.</span></div>`; return; }
  const years = Object.entries(B.signals_by_year || {}).map(([y, n]) => `${y}: ${n}`).join(" · ");
  renderPortfolio(el, B, `<b>${B.years}-year backtest</b> (${fmtDate(B.summary.start_date)} – ${fmtDate(B.summary.as_of)}). ${esc(B.note)} Past results don't guarantee future returns.`);
  el.insertAdjacentHTML("beforeend", `<h2>Signals per year</h2><div class="card small num">${years || "—"}</div>`);
}

// ---------- Rules ----------
function renderRules(R) {
  $("#rules").innerHTML = `<h2>When is a stock "on sale"?</h2><div class="card"><p style="margin-top:0">A stock must pass <b>all four</b> checks at once:</p><ol class="rules">
    <li><b>Down at least ${R.min_drop_pct}%</b> from its 52-week high.</li>
    <li><b>Below its ${R.sma_days}-day average price</b>, so the drop isn't just a one-day blip.</li>
    <li><b>Cheap compared with its peers:</b> P/E at least ${R.pe_discount_pct}% below the median P/E of its S&amp;P 500 sector.</li>
    <li><b>A healthy business:</b> profitable (positive earnings) with positive free cash flow, to avoid "falling knives."</li></ol>
    <p class="small muted" style="margin-bottom:0">A stock can be bought at most once every ${R.cooldown_days} days, even if it stays on sale.</p></div>
    <h2>The two simulated strategies</h2><div class="card">
    <p style="margin-top:0"><b>A · Fixed dollars:</b> invest ${money(R.fixed_amount)} each time a stock goes on sale, and compare it with putting the same ${money(R.fixed_amount)} into SPY, QQQ and DIA on the same day.</p>
    <p style="margin-bottom:0"><b>B · Starting balance:</b> start with ${money(R.start_balance)} cash. Each buy is ${R.position_pct}% of the starting balance while cash lasts. Sell when a holding is up ${R.take_profit_pct}% or after ${R.max_hold_days} days. Compared with ${money(R.start_balance)} put into each index on day one.</p></div>
    <h2>Good to know</h2><div class="card small">
    <p style="margin-top:0">Prices come from Yahoo Finance and include dividends. The scan runs every weekday after the market closes. Simulated trades use that day's closing price, with no fees or taxes. Cash in strategy B earns no interest.</p>
    <p style="margin-bottom:0">This is a learning tool, not financial advice. A cheap stock can keep getting cheaper.</p></div>
    <p class="small muted">Change the rules in <code>tracker/config.py</code> on GitHub.</p>`;
}

// ---------- Load ----------
async function getJSON(name) {
  try { const r = await fetch(`data/${name}.json?t=${Date.now()}`, {cache: "no-store"}); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
(async () => {
  const [latest, portfolio, backtest] = await Promise.all([getJSON("latest"), getJSON("portfolio"), getJSON("backtest")]);
  DATA = {latest, portfolio, backtest};
  if (!latest) {
    $("#asof").textContent = "Waiting for the first scan";
    $("#sale").innerHTML = `<div class="card empty">No scan has run yet.<br><span class="small muted">On GitHub, open Actions → "Daily scan" → Run workflow. Results show up here about 15 minutes later.</span></div>`;
    renderBacktest();
    return;
  }
  $("#asof").textContent = `Market close ${fmtDate(latest.as_of)} · ${latest.universe_size} stocks scanned`;
  renderSale(latest); renderRules(latest.rules); renderTrades(); renderBacktest();
  if (portfolio) renderPortfolio($("#pf"), portfolio); else $("#pf").innerHTML = `<div class="card empty">No portfolio yet.</div>`;
  const tab = (location.hash || "").slice(1);
  show(["sale", "pf", "trades", "bt", "rules"].includes(tab) ? tab : "sale");
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (document.getElementById(t)) show(t); });
})();
</script>
</body>
</html>
