name: Daily scan (ASX)

on:
  schedule:
    # 07:20 UTC on weekdays = 5:20/6:20 PM Sydney (after the ASX close, all year)
    - cron: "20 7 * * 1-5"
  workflow_dispatch: {}
  push:                    # re-run automatically when the bot's code changes
    branches: [main]
    paths: ["tracker/**"]

permissions:
  contents: write

concurrency:
  group: data-update-asx
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan ASX 200 and update portfolios
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m tracker.run_daily --market asx
      - name: Save results
        run: |
          git config user.name "sale-tracker-bot"
          git config user.email "sale-tracker-bot@users.noreply.github.com"
          git add docs/data cache
          git diff --cached --quiet || git commit -m "Daily scan ASX $(date -u +%F)"
          git pull --rebase --autostash
          git push
